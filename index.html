<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR AI Agent Dev Process</title>
    <meta name="description" content="HR AI Agent를 구현하기 위한 개발 프로세스, Agentic Workflow, Reasoning, Harness Engineering 학습 자료입니다.">
    <meta name="theme-color" content="#f97316">
    <!-- Fonts: expressive Korean display + clean body -->
    <link rel="stylesheet" href="https://webfontworld.github.io/gmarket/GmarketSans.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css">
    <!-- Icons: Lucide -->
    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <!-- Markdown rendering + sanitizing -->
    <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-locked">
    <section id="auth-gate" class="auth-gate" aria-label="Password required">
        <div class="auth-card">
            <div class="auth-icon"><i data-lucide="lock-keyhole"></i></div>
            <p class="auth-kicker">Restricted Access</p>
            <h1>비밀번호를 입력해 주세요</h1>
            <p class="auth-desc">이 HTML 앱에 접근하려면 지정된 비밀번호가 필요합니다.</p>
            <form id="auth-form" class="auth-form">
                <label for="auth-password">비밀번호</label>
                <div class="auth-password-row">
                    <input id="auth-password" name="password" type="password" autocomplete="current-password" inputmode="numeric" required autofocus>
                    <button id="auth-toggle" class="auth-toggle" type="button" aria-label="비밀번호 보기">
                        <i data-lucide="eye"></i>
                    </button>
                </div>
                <p id="auth-error" class="auth-error" role="alert" hidden>비밀번호가 올바르지 않습니다.</p>
                <button class="auth-submit" type="submit">입장하기</button>
            </form>
        </div>
    </section>

    <header id="gnb">
        <nav class="nav-container">
            <div class="logo">
                <i data-lucide="bot"></i>
                <span>J's AI Agent Dev Class</span>
            </div>
            <ul class="nav-menu">
                <li><a href="#/process" class="active">Dev Process</a></li>
                <li><a href="#/workflow">Agentic Workflow</a></li>
                <li><a href="#/reasoning">Reasoning</a></li>
                <li><a href="#/harness">Harness</a></li>
                <li><a href="#/environment">Environment</a></li>
                <li><a href="#/examples">Examples</a></li>
            </ul>
        </nav>
    </header>

    <main id="content-root">
        <!-- JS에 의해 동적으로 렌더링됩니다. -->
        <div class="loader">Loading...</div>
        <noscript>이 앱을 보려면 브라우저에서 JavaScript를 활성화해 주세요.</noscript>
    </main>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-close" id="modal-close">
                <i data-lucide="x"></i>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- Skill details will be injected here -->
            </div>
        </div>
    </div>

    <!-- App Scripts -->
    <script defer src="./data.js"></script>
    <script defer src="./app.js"></script>
</body>
</html>
